<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield -->
  <rect width="512" height="512" rx="110" fill="url(#darkBg)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="8" />

  <!-- Outer Glow Hexagon / Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#emeraldGrad)" stroke-width="12" stroke-dasharray="16 10" opacity="0.4" />

  <!-- Central Stellar Rocket / Gavel Icon -->
  <g filter="url(#glow)" transform="translate(128, 128) scale(0.5)">
    <!-- Gavel / Rocket Head -->
    <path d="M 256,40 L 360,180 L 300,200 L 212,200 L 152,180 Z" fill="url(#emeraldGrad)" />
    <!-- Gavel Handle / Base -->
    <rect x="230" y="200" width="52" height="220" rx="26" fill="url(#emeraldGrad)" />
    <path d="M 120,400 L 392,400 C 410,400 420,420 400,435 L 350,470 C 340,480 320,480 300,480 L 212,480 C 192,480 172,480 162,470 L 112,435 C 92,420 102,400 120,400 Z" fill="#ffffff" opacity="0.95" />
    <!-- Stars -->
    <circle cx="256" cy="110" r="18" fill="#ffffff" />
    <circle cx="150" cy="140" r="10" fill="#06b6d4" />
    <circle cx="362" cy="140" r="10" fill="#10b981" />
  </g>

  <!-- StellarBid Text -->
  <text x="256" y="440" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="38" fill="#ffffff" text-anchor="middle" letter-spacing="4">STELLARBID</text>
</svg>
